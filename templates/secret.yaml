{{- if not .Values.app.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "buggregator.fullname" . }}
  labels:
    {{- include "buggregator.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.app.encrypterKey }}
  encrypter-key: {{ .Values.app.encrypterKey | b64enc | quote }}
  {{- else }}
  encrypter-key: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
{{- end }}
---
{{- if and (eq .Values.persistence.driver "db") (not .Values.externalDatabase.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "buggregator.fullname" . }}-db
  labels:
    {{- include "buggregator.labels" . | nindent 4 }}
type: Opaque
data:
  db-password: {{ .Values.externalDatabase.password | b64enc | quote }}
{{- end }}
---
{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "buggregator.fullname" . }}-auth
  labels:
    {{- include "buggregator.labels" . | nindent 4 }}
type: Opaque
data:
  client-id: {{ .Values.auth.clientId | b64enc | quote }}
  client-secret: {{ .Values.auth.clientSecret | b64enc | quote }}
{{- end }}
