apiVersion: v1
kind: Service
metadata:
  name: {{ include "buggregator.fullname" . }}
  labels:
    {{- include "buggregator.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.httpPort }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.smtpPort }}
      targetPort: smtp
      protocol: TCP
      name: smtp
    - port: {{ .Values.service.varDumperPort }}
      targetPort: var-dumper
      protocol: TCP
      name: var-dumper
    - port: {{ .Values.service.monologPort }}
      targetPort: monolog
      protocol: TCP
      name: monolog
    {{- if and .Values.metrics.enabled .Values.metrics.addr }}
    - port: {{ (split ":" .Values.metrics.addr)._1 | default 9090 }}
      targetPort: metrics
      protocol: TCP
      name: metrics
    {{- end }}
  selector:
    {{- include "buggregator.selectorLabels" . | nindent 4 }}
