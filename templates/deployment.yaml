apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "buggregator.fullname" . }}
  labels:
    {{- include "buggregator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "buggregator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "buggregator.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "buggregator.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: smtp
              containerPort: 1025
              protocol: TCP
            - name: var-dumper
              containerPort: 9912
              protocol: TCP
            - name: monolog
              containerPort: 9913
              protocol: TCP
            {{- if and .Values.metrics.enabled .Values.metrics.addr }}
            - name: metrics
              containerPort: {{ (split ":" .Values.metrics.addr)._1 | default 9090 }}
              protocol: TCP
            {{- end }}
            {{- if and .Values.mcp.enabled (eq .Values.mcp.transport "http") }}
            - name: mcp
              containerPort: {{ (split ":" .Values.mcp.addr)._1 | default 8001 }}
              protocol: TCP
            {{- end }}
          env:
            # --- Database ---
            - name: DATABASE_DSN
              value: {{ .Values.database.dsn | quote }}

            # --- Attachment Storage ---
            - name: STORAGE_MODE
              value: {{ .Values.attachmentStorage.mode | quote }}
            {{- if eq .Values.attachmentStorage.mode "filesystem" }}
            - name: STORAGE_PATH
              value: {{ .Values.attachmentStorage.path | quote }}
            {{- end }}

            # --- CORS ---
            - name: CORS_ORIGINS
              value: {{ .Values.cors.origins | quote }}

            # --- Events ---
            - name: CLIENT_SUPPORTED_EVENTS
              value: {{ .Values.supportedEvents | quote }}

            # --- Metrics ---
            {{- if .Values.metrics.enabled }}
            - name: METRICS_ENABLED
              value: "true"
            {{- if .Values.metrics.addr }}
            - name: METRICS_ADDR
              value: {{ .Values.metrics.addr | quote }}
            {{- end }}
            {{- end }}

            # --- MCP ---
            {{- if .Values.mcp.enabled }}
            - name: MCP_ENABLED
              value: "true"
            - name: MCP_TRANSPORT
              value: {{ .Values.mcp.transport | quote }}
            {{- if eq .Values.mcp.transport "socket" }}
            - name: MCP_SOCKET_PATH
              value: {{ .Values.mcp.socketPath | quote }}
            {{- else }}
            - name: MCP_ADDR
              value: {{ .Values.mcp.addr | quote }}
            {{- if .Values.mcp.authToken }}
            - name: MCP_AUTH_TOKEN
              value: {{ .Values.mcp.authToken | quote }}
            {{- end }}
            {{- end }}
            {{- end }}

            # --- Auth / SSO ---
            - name: AUTH_ENABLED
              value: {{ .Values.auth.enabled | quote }}
            {{- if .Values.auth.enabled }}
            - name: AUTH_PROVIDER
              value: {{ .Values.auth.provider | quote }}
            - name: AUTH_PROVIDER_URL
              value: {{ .Values.auth.providerUrl | quote }}
            - name: AUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "buggregator.authSecretName" . }}
                  key: client-id
            - name: AUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "buggregator.authSecretName" . }}
                  key: client-secret
            - name: AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "buggregator.authSecretName" . }}
                  key: jwt-secret
            - name: AUTH_CALLBACK_URL
              value: {{ .Values.auth.callbackUrl | quote }}
            - name: AUTH_SCOPES
              value: {{ .Values.auth.scopes | quote }}
            {{- end }}

          livenessProbe:
            httpGet:
              path: /api/settings
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/settings
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          {{- if .Values.storage.enabled }}
          volumeMounts:
            - name: data
              mountPath: /data
          {{- end }}

          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

      {{- if .Values.storage.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "buggregator.fullname" . }}-data
      {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
