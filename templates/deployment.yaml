{{- if ne (int .Values.replicaCount) 1 }}
{{- fail "replicaCount must be 1: Buggregator keeps its data in SQLite (one writer) on a ReadWriteOnce volume" }}
{{- end }}
{{- /* Keys added in chart 3.0 can be missing: "helm upgrade --reuse-values" from 2.x
     (the command server 2.11 shows) renders with the old chart's values. */}}
{{- $xdebug := .Values.xdebug | default dict }}
{{- $xdebugTrace := .Values.xdebugTrace | default dict }}
{{- $retention := .Values.retention | default dict }}
{{- $ui := .Values.ui | default dict }}
{{- $sentry := .Values.sentry | default dict }}
{{- $update := .Values.update | default dict }}
{{- $volumePermissions := .Values.volumePermissions | default dict }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "buggregator.fullname" . }}
  labels:
    {{- include "buggregator.labels" . | nindent 4 }}
spec:
  replicas: 1
  # The old pod must stop before the new one opens the same SQLite file and
  # ReadWriteOnce volume.
  strategy:
    type: Recreate
    # Clears the rollingUpdate block an older RollingUpdate release left in the
    # live object; Kubernetes rejects it next to Recreate.
    rollingUpdate: null
  selector:
    matchLabels:
      {{- include "buggregator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Restart on a change of the auth values, not on the rendered secret:
        # a generated JWT secret (jwtSecret "") must not restart the pod on
        # every upgrade; an explicit one changes the checksum.
        checksum/auth: {{ .Values.auth | toJson | sha256sum }}
        {{- if .Values.config }}
        checksum/config: {{ toYaml .Values.config | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "buggregator.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "buggregator.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and $volumePermissions.enabled .Values.storage.enabled }}
      initContainers:
        - name: volume-permissions
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - chown -R {{ .Values.podSecurityContext.runAsUser | default 65532 }}:{{ .Values.podSecurityContext.runAsGroup | default 65532 }} /data
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, FOWNER, DAC_OVERRIDE]
          volumeMounts:
            - name: data
              mountPath: /data
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.config }}
          args: ["--config", "/etc/buggregator/buggregator.yaml"]
          {{- end }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: smtp
              containerPort: 1025
              protocol: TCP
            - name: var-dumper
              containerPort: 9912
              protocol: TCP
            - name: monolog
              containerPort: 9913
              protocol: TCP
            - name: proxy
              containerPort: 8080
              protocol: TCP
            {{- if $xdebug.enabled }}
            - name: xdebug
              containerPort: 9003
              protocol: TCP
            {{- end }}
            {{- if and .Values.metrics.enabled .Values.metrics.addr }}
            - name: metrics
              containerPort: {{ (split ":" .Values.metrics.addr)._1 | default 9090 }}
              protocol: TCP
            {{- end }}
            {{- if and .Values.mcp.enabled (eq .Values.mcp.transport "http") }}
            - name: mcp
              containerPort: {{ (split ":" .Values.mcp.addr)._1 | default 8001 }}
              protocol: TCP
            {{- end }}
          env:
            - name: DATABASE_DSN
              value: {{ include "buggregator.databaseDsn" . | quote }}
            - name: STORAGE_MODE
              value: {{ include "buggregator.attachmentMode" . | quote }}
            {{- if eq (include "buggregator.attachmentMode" .) "filesystem" }}
            - name: STORAGE_PATH
              value: {{ .Values.attachmentStorage.path | quote }}
            {{- end }}

            {{- if $xdebug.enabled }}
            - name: XDEBUG_PROXY_ENABLED
              value: "true"
            - name: XDEBUG_PROXY_ADDR
              value: "0.0.0.0:9003"
            {{- end }}
            # Optional settings: rendered only when set; unset ones are left to
            # the config file or the server default.
            {{- $optional := list
                (list "DATABASE_MAX_OPEN_CONNS" .Values.database.maxOpenConns)
                (list "RETENTION_MAX_AGE" $retention.maxAge)
                (list "RETENTION_MAX_EVENTS" $retention.maxEvents)
                (list "CORS_ORIGINS" .Values.cors.origins)
                (list "CLIENT_SUPPORTED_EVENTS" .Values.supportedEvents)
                (list "UI_DEFAULT_LIMIT" $ui.defaultLimit)
                (list "UI_MAX_LIMIT" $ui.maxLimit)
                (list "UI_DEFAULT_WINDOW" $ui.defaultWindow)
                (list "SENTRY_SOURCE_FETCH" $sentry.sourceFetch)
                (list "UPDATE_CHECK_ENABLED" $update.checkEnabled)
                (list "UPDATE_CHECK_INTERVAL" $update.checkInterval)
                (list "UPDATE_SELF" $update.selfUpdate)
                (list "XDEBUG_TRACE_MAX_UPLOAD" $xdebugTrace.maxUpload)
                (list "XDEBUG_TRACE_MAX_SIZE" $xdebugTrace.maxSize)
                (list "XDEBUG_TRACE_KEEP" $xdebugTrace.keep) }}
            {{- if $xdebug.enabled }}
            {{- $optional = concat $optional (list
                (list "XDEBUG_PROXY_IDE_ADDR" $xdebug.ideAddr)
                (list "XDEBUG_PROXY_MODE" $xdebug.mode)
                (list "XDEBUG_PROXY_IDLE_TIMEOUT" $xdebug.idleTimeout)
                (list "XDEBUG_PROXY_ALLOW_EVAL" $xdebug.allowEval)
                (list "XDEBUG_PROXY_ALLOW_CONTROL" $xdebug.allowControl)
                (list "XDEBUG_PROXY_PAUSE_ON_FIRST_LINE" $xdebug.pauseOnFirstLine)) }}
            {{- end }}
            {{- if .Values.metrics.enabled }}
            {{- $optional = append $optional (list "METRICS_ADDR" .Values.metrics.addr) }}
            {{- end }}
            {{- range $optional }}
            {{- $v := index . 1 }}
            {{- if kindIs "float64" $v }}{{- $v = int64 $v }}{{- end }}{{/* 1000000, not 1e+06 */}}
            {{- if and (not (kindIs "invalid" $v)) (ne (toString $v) "") }}
            - name: {{ index . 0 }}
              value: {{ $v | toString | quote }}
            {{- end }}
            {{- end }}

            {{- if .Values.metrics.enabled }}
            - name: METRICS_ENABLED
              value: "true"
            {{- end }}

            {{- if .Values.mcp.enabled }}
            - name: MCP_ENABLED
              value: "true"
            - name: MCP_TRANSPORT
              value: {{ .Values.mcp.transport | quote }}
            {{- if eq .Values.mcp.transport "socket" }}
            - name: MCP_SOCKET_PATH
              value: {{ .Values.mcp.socketPath | quote }}
            {{- else }}
            - name: MCP_ADDR
              value: {{ .Values.mcp.addr | quote }}
            {{- if .Values.mcp.existingSecret }}
            - name: MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mcp.existingSecret }}
                  key: {{ .Values.mcp.existingSecretKey | default "mcp-auth-token" }}
            {{- else if .Values.mcp.authToken }}
            - name: MCP_AUTH_TOKEN
              value: {{ .Values.mcp.authToken | quote }}
            {{- end }}
            {{- end }}
            {{- end }}

            - name: AUTH_ENABLED
              value: {{ .Values.auth.enabled | quote }}
            {{- if .Values.auth.enabled }}
            - name: AUTH_PROVIDER
              value: {{ .Values.auth.provider | quote }}
            - name: AUTH_PROVIDER_URL
              value: {{ .Values.auth.providerUrl | quote }}
            - name: AUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "buggregator.authSecretName" . }}
                  key: client-id
            - name: AUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "buggregator.authSecretName" . }}
                  key: client-secret
            - name: AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "buggregator.authSecretName" . }}
                  key: jwt-secret
            - name: AUTH_CALLBACK_URL
              value: {{ .Values.auth.callbackUrl | quote }}
            - name: AUTH_SCOPES
              value: {{ .Values.auth.scopes | quote }}
            {{- with .Values.auth.allowedEmails }}
            - name: AUTH_ALLOWED_EMAILS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.auth.allowedDomains }}
            - name: AUTH_ALLOWED_DOMAINS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          startupProbe:
            httpGet:
              path: /api/version
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            # Up to 5 minutes for migrations on a big database.
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /api/version
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/version
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          volumeMounts:
            # The VarDumper parser is unpacked into /tmp and run from there; the
            # MCP socket lives there too. Needed with readOnlyRootFilesystem.
            - name: tmp
              mountPath: /tmp
            {{- if .Values.storage.enabled }}
            - name: data
              mountPath: /data
            {{- end }}
            {{- if .Values.config }}
            - name: config
              mountPath: /etc/buggregator
              readOnly: true
            {{- end }}

          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.storage.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "buggregator.fullname" . }}-data
        {{- end }}
        {{- if .Values.config }}
        - name: config
          configMap:
            name: {{ include "buggregator.fullname" . }}-config
        {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
