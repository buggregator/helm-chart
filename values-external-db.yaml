# Example: Buggregator with persistent SQLite database
#
# helm install buggregator ./helm-chart -f helm-chart/values-external-db.yaml

database:
  dsn: /data/buggregator.db

attachmentStorage:
  mode: filesystem
  path: /data/storage

storage:
  enabled: true
  size: 10Gi

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi
