name: Release

# A tag vX.Y.Z publishes the chart as oci://ghcr.io/buggregator/helm-chart/buggregator:X.Y.Z
# (the address the docs and the server's update hint give).
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Tag matches Chart.yaml
        run: |
          version=$(grep '^version:' Chart.yaml | awk '{print $2}')
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != Chart.yaml version ${version}"; exit 1; }
      - name: Lint and package
        run: |
          helm lint . --strict
          helm package . --destination dist
      - name: Push to ghcr
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push dist/buggregator-*.tgz oci://ghcr.io/buggregator/helm-chart
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" dist/buggregator-*.tgz --title "${GITHUB_REF_NAME}" --generate-notes
