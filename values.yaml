# -- Number of replicas. Must stay 1: SQLite has a single writer and the
# volume is ReadWriteOnce. The chart fails to render with any other value.
replicaCount: 1

image:
  repository: ghcr.io/buggregator/server
  pullPolicy: IfNotPresent
  # -- Overrides the image tag (default is appVersion)
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# =============================================================================
# Database (SQLite)
# =============================================================================
database:
  # -- SQLite DSN. Empty: /data/buggregator.db when storage.enabled, else
  # ":memory:" (data lost on every restart).
  dsn: ""
  # -- SQLite connection pool size (server default when empty)
  maxOpenConns: ""

# =============================================================================
# Attachment storage (SMTP attachments, HTTP dump files)
# =============================================================================
attachmentStorage:
  # -- Storage mode: "memory" or "filesystem". Empty: filesystem when
  # storage.enabled, else memory.
  mode: ""
  # -- Directory for filesystem mode (relative to working dir or absolute path)
  path: /data/storage

# =============================================================================
# Retention: old events are deleted (pinned ones are kept)
# =============================================================================
retention:
  # -- Delete events older than this, e.g. "24h", "7d". Empty = keep forever
  maxAge: ""
  # -- Keep at most this many events in total. Empty or 0 = no cap
  maxEvents: ""

# =============================================================================
# Server configuration file (buggregator.yaml)
# =============================================================================
# -- Contents of buggregator.yaml, for what has no value here: projects,
# webhooks, mock rules... Mounted as a ConfigMap and passed with --config.
# Environment variables set by this chart take precedence over the file.
config: {}
  # projects:
  #   - key: shop
  #     name: Shop backend
  # webhooks:
  #   - event: sentry
  #     url: https://hooks.example.com/buggregator

# =============================================================================
# CORS
# =============================================================================
cors:
  # -- Comma-separated list of allowed CORS origins
  origins: "*"

# =============================================================================
# Authentication / SSO (OAuth2/OIDC)
# =============================================================================
auth:
  # -- Enable SSO authentication
  enabled: false
  # -- Auth provider: auth0, google, github, keycloak, gitlab, oidc
  provider: oidc
  # -- Provider URL (e.g. https://your-tenant.auth0.com)
  providerUrl: ""
  # -- OAuth client ID
  clientId: ""
  # -- OAuth client secret
  clientSecret: ""
  # -- OAuth callback URL (e.g. https://buggregator.example.com/auth/sso/callback)
  callbackUrl: ""
  # -- OAuth scopes
  scopes: "openid,email,profile"
  # -- JWT secret for signing internal session tokens. Empty: generated once
  # on install and kept across upgrades (sessions survive helm upgrade).
  jwtSecret: ""
  # -- Use existing secret for auth credentials (keys: client-id, client-secret, jwt-secret)
  existingSecret: ""

# =============================================================================
# MCP (Model Context Protocol) for AI assistants
# =============================================================================
mcp:
  # -- Enable MCP server
  enabled: false
  # -- Transport: "socket" or "http"
  transport: socket
  # -- Unix socket path (for socket transport)
  socketPath: /tmp/buggregator-mcp.sock
  # -- HTTP listen address (for http transport)
  addr: ":8001"
  # -- Bearer token for HTTP transport auth (optional)
  authToken: ""
  # -- Take the token from an existing secret instead
  existingSecret: ""
  # -- Key of the token in that secret
  existingSecretKey: mcp-auth-token

# =============================================================================
# Supported event types
# =============================================================================
# -- Comma-separated list of enabled event types. Empty = all of them
# (http-dump, inspector, monolog, profiler, ray, sentry, sms, smtp, var-dump, xdebug-trace)
supportedEvents: ""

# =============================================================================
# UI event lists
# =============================================================================
ui:
  # -- Events returned without a limit param. Empty or 0 = unlimited
  defaultLimit: ""
  # -- Ceiling for an explicit limit (server default 5000). 0 = no ceiling
  maxLimit: ""
  # -- Default time window, e.g. "1h", "24h", "7d". Empty = none
  defaultWindow: ""

# =============================================================================
# Sentry
# =============================================================================
sentry:
  # -- Fetch JS source files for stack frames: private (default), any or off
  sourceFetch: ""

# =============================================================================
# New-version check and update from the UI
# =============================================================================
update:
  # -- Ask GitHub for the newest release and show a notice (server default true)
  checkEnabled: null
  # -- How often to check, e.g. "12h" (minimum 1h)
  checkInterval: ""
  # -- Update from the UI: auto, on or off. In Kubernetes "auto" never replaces
  # the binary: it shows the helm upgrade command instead.
  selfUpdate: ""

# =============================================================================
# Xdebug proxy (DBGp) and uploaded Xdebug traces
# =============================================================================
xdebug:
  # -- Start the Xdebug proxy on port 9003 (listens on all interfaces in the pod)
  enabled: false
  # -- Where the IDE listens, e.g. "host.example.com:9004" (server default 127.0.0.1:9004)
  ideAddr: ""
  # -- proxy, auto or standalone (server default auto)
  mode: ""
  # -- Release a paused session after this long without a command, e.g. "10m"; "0" = never
  idleTimeout: ""
  # -- Expose the xdebug_eval MCP tool
  allowEval: null
  # -- Expose the MCP control tools: step, continue, stop, wait (server default true)
  allowControl: null
  # -- A session driven here stops at the first line
  pauseOnFirstLine: null

xdebugTrace:
  # -- Largest accepted upload, e.g. "100MB"
  maxUpload: ""
  # -- Largest trace kept after unpacking, e.g. "256MB"
  maxSize: ""
  # -- How many traces to keep (server default 20)
  keep: ""

# =============================================================================
# Extra environment
# =============================================================================
# -- Extra env vars for the container (list of {name, value} or valueFrom)
extraEnv: []
# -- envFrom sources (ConfigMaps or Secrets)
envFrom: []

# =============================================================================
# Service ports
# =============================================================================
service:
  type: ClusterIP
  # -- Main web UI + HTTP API port
  httpPort: 8000
  # -- SMTP server port for email capture
  smtpPort: 1025
  # -- Symfony VarDumper server port
  varDumperPort: 9912
  # -- Monolog server port
  monologPort: 9913
  # -- HTTP proxy port (records requests sent through it)
  proxyPort: 8080
  # -- Xdebug proxy port (only with xdebug.enabled)
  xdebugPort: 9003
  # -- Annotations for the Service
  annotations: {}

# -- A second Service for the TCP ports (SMTP, VarDumper, Monolog, HTTP proxy,
# Xdebug): an Ingress carries only HTTP, so expose these with a LoadBalancer
# or NodePort to reach them from outside the cluster.
tcpService:
  enabled: false
  type: LoadBalancer
  annotations: {}
  # -- loadBalancerIP / externalTrafficPolicy and the like, passed as is
  extraSpec: {}

# =============================================================================
# Ingress
# =============================================================================
ingress:
  enabled: false
  className: ""
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    # The UI keeps a WebSocket open (/connection/websocket); ingress-nginx
    # closes idle ones after 60s by default:
    # nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    # nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  hosts:
    - host: buggregator.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: buggregator-tls
  #    hosts:
  #      - buggregator.local

# =============================================================================
# Storage (PVC for persistent data: SQLite DB, attachments)
# =============================================================================
storage:
  # -- Persistent volume at /data for the SQLite database and attachments.
  # With it off, everything is kept in memory and lost on restart.
  enabled: true
  # -- Storage class (empty for default)
  storageClassName: ""
  # -- Storage size
  size: 5Gi
  # -- Access modes
  accessModes:
    - ReadWriteOnce

# =============================================================================
# Prometheus metrics
# =============================================================================
metrics:
  # -- Enable Prometheus metrics
  enabled: false
  # -- Separate metrics server address (e.g. ":9090"). Empty = serve /metrics on main HTTP server
  addr: ""
  # -- Enable Prometheus ServiceMonitor
  serviceMonitor:
    enabled: false
    # -- ServiceMonitor namespace (defaults to release namespace)
    namespace: ""
    # -- Additional labels for ServiceMonitor
    labels: {}
    # -- Scrape interval
    interval: 30s

# =============================================================================
# Service account
# =============================================================================
serviceAccount:
  create: true
  # -- The server does not call the Kubernetes API
  automount: false
  annotations: {}
  name: ""

# =============================================================================
# Pod configuration
# =============================================================================
podAnnotations: {}
podLabels: {}

# -- Runs as a non-root user; fsGroup makes the volume writable for it
# (files written by older root-run releases included).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# -- An init container that gives /data to the pod's user once (chown) before
# the server starts. Needed only where the volume plugin ignores fsGroup
# (hostPath, local-path, many NFS setups) and the data was written by a
# release that ran as root (chart 2.x). It runs as root with CHOWN, FOWNER and
# DAC_OVERRIDE, so clusters with the "restricted" Pod Security level reject it.
volumePermissions:
  enabled: false

# -- No limits by default: memory grows with the in-memory attachment store
# and big payloads. Set them for your load.
resources:
  requests:
    cpu: 50m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}
