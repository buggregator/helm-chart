# Example: Buggregator with SSO (Auth0), persistent storage, and Ingress
#
# helm install buggregator ./helm-chart -f helm-chart/values-sso.yaml

database:
  dsn: /data/buggregator.db

attachmentStorage:
  mode: filesystem
  path: /data/storage

storage:
  enabled: true
  size: 10Gi

auth:
  enabled: true
  provider: auth0
  providerUrl: "https://your-tenant.auth0.com"
  clientId: "your-client-id"
  clientSecret: "your-client-secret"
  callbackUrl: "https://buggregator.example.com/auth/sso/callback"
  scopes: "openid,email,profile"
  jwtSecret: "change-me-to-a-random-string"

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: buggregator.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: buggregator-tls
      hosts:
        - buggregator.example.com

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
