# Example: Buggregator with SSO (Auth0), a bigger volume, Ingress with TLS and metrics
#
# helm install buggregator oci://ghcr.io/buggregator/helm-chart/buggregator -f values-sso.yaml

storage:
  enabled: true
  size: 10Gi

auth:
  enabled: true
  provider: auth0
  providerUrl: "https://your-tenant.auth0.com"
  clientId: "your-client-id"
  clientSecret: "your-client-secret"
  callbackUrl: "https://buggregator.example.com/auth/sso/callback"
  scopes: "openid,email,profile"
  allowedDomains: ["mycompany.com"]  # who may sign in; or allowedEmails: ["me@gmail.com"]
  # jwtSecret: empty = generated on install and kept across upgrades

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: buggregator.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: buggregator-tls
      hosts:
        - buggregator.example.com

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
